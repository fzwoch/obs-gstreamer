on: push
env:
  MACOSX_DEPLOYMENT_TARGET: 13.0
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fzwoch/klumpatsch
    strategy:
      matrix:
        include:
          - { os: mingw, arch: x86_64, ldlags: "", require-libobs: "true" }
          - { os: mingw, arch: arm64, ldflags: "", require-libobs: "true" }
          - { os: macos, arch: x86_64, ldflags: "-Wl,-undefined,dynamic_lookup", require-libobs: "false" }
          - { os: macos, arch: arm64, ldflags: "-Wl,-undefined,dynamic_lookup", require-libobs: "false" }
          - { os: linux, arch: x86_64, ldflags: "-Wl,--unresolved-symbols=ignore-all", require-libobs: "false" }
          - { os: linux, arch: arm64, ldflags: "-Wl,--unresolved-symbols=ignore-all", require-libobs: "false" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flex/bison
        run: |
            apt update
            apt install -y flex bison

      - name: Unpack OBS headers
        run: |
          mkdir /tmp/simde
          wget -q -O- https://github.com/simd-everywhere/simde/releases/download/v0.8.2/simde-amalgamated-0.8.2.tar.xz | tar xJ --strip-components 1 -C /tmp/simde
          mkdir /tmp/unpack-obs-headers
          wget -q -O- https://github.com/obsproject/obs-studio/archive/refs/tags/31.1.0.tar.gz | tar xz --strip-components 1 -C /tmp/unpack-obs-headers
          mv /tmp/unpack-obs-headers/libobs /tmp/obs
          touch /tmp/obs/obsconfig.h

      - name: Unpack OBS libraries
        if: ${{ matrix.os == 'mingw' }}
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            wget -q -O /tmp/obs.zip https://github.com/obsproject/obs-studio/releases/download/31.1.0/OBS-Studio-31.1.0-Windows-x64.zip
          else
            wget -q -O /tmp/obs.zip https://github.com/obsproject/obs-studio/releases/download/31.1.0/OBS-Studio-31.1.0-Windows-arm64.zip
          fi
          unzip -o /tmp/obs.zip "bin/64bit/obs.dll" -d /tmp/unpack-obs
          mv /tmp/unpack-obs/bin/64bit/*.dll /tmp/obs

      - name: Build
        env:
          C_INCLUDE_PATH: /tmp
        run: |
          echo "subsystem = 'macos'" >> /meson/macos-x86_64.txt
          echo "subsystem = 'macos'" >> /meson/macos-arm64.txt
          # Without an explicit windres, meson falls back to the build
          # machine's llvm-windres, which produces x64 resources that fail to
          # link into the arm64 build. Derive the tool prefix from the strip
          # entry so the arch spelling matches the toolchain (aarch64 vs
          # arm64).
          if [ "${{ matrix.os }}" = "mingw" ]; then
            triplet=$(sed -n "s/^strip = '\(.*\)-strip'/\1/p" /meson/mingw-${{ matrix.arch }}.txt)
            sed -i "/^strip = /a windres = '${triplet}-windres'" /meson/mingw-${{ matrix.arch }}.txt
          fi
          # Do not use LIBRARY_PATH to locate obs.dll: GCC/Clang ignore it when
          # cross compiling (host arch != target arch), which breaks the arm64
          # mingw build. Pass the search path explicitly instead.
          meson setup --buildtype=release -Dprefix=$PWD -Dbindir=. -Dlink-args=${{ matrix.ldflags }} -Drequire-libobs=${{ matrix.require-libobs }} -Dc_link_args="-L/tmp/obs" -Dstrip=true -Db_lto=true --cross-file=/meson/${{ matrix.os }}-${{ matrix.arch }}.txt build
          meson compile -C build
          meson install --skip-subprojects -C build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: obs-gstreamer-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            obs-gstreamer.dll
            obs-gstreamer.dylib
            obs-gstreamer.so
