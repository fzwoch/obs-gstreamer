latency.label="Fixed latency (ms)"
latency.desc="Sets a fixed latency for the pipeline for syncing different inputs. Check the error log for clock errors if the set latency is too low. Setting 0 auto-detects the lowest possible latency for the given pipeline."
verbose.log="Verbose pipeline logging"
verbose.log.desc="Log QoS events, element state changes and custom bus messages to the OBS log file while this source is active. Useful for debugging pipelines."
ntp.server="NTP server"
ntp.server.desc="Sets an NTP server for syncing the GStreamer clock to. Use e.g. with rtspsrc rfc7273-sync or ntp-sync options. Leave empty to not use an NTP server; if the server cannot be reached the pipeline continues without it."
